<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do you wanna see?? 💕 | Boyfriend Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Fredoka:wght@500;600;700;800&family=Sniglet:wght@800&family=Comfortaa:wght@700&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="theme-red-gingham">

    <!-- Ambient Animated Background Wonderland (Dreamy Glows, Sparkles, Stars, Bubbles, Clouds) -->
    <div class="bg-animated-decor" aria-hidden="true">
        <div class="ambient-glow glow-blue"></div>
        <div class="ambient-glow glow-pink"></div>

        <!-- Cute Floating Birthday Elements -->
        <span class="floating-particle p-sparkle-1">✦</span>
        <span class="floating-particle p-star-1">★</span>
        <span class="floating-particle p-bubble-1">🫧</span>
        <span class="floating-particle p-sparkle-2">✨</span>
        <span class="floating-particle p-heart-1">💙</span>
        <span class="floating-particle p-cloud-1">☁️</span>
        <span class="floating-particle p-sparkle-3">✦</span>
        <span class="floating-particle p-star-2">★</span>
        <span class="floating-particle p-bubble-2">🫧</span>
        <span class="floating-particle p-heart-2">💕</span>
        <span class="floating-particle p-sparkle-4">✨</span>
        <span class="floating-particle p-cloud-2">☁️</span>

        <!-- Extra Cutu Stars & Loves! -->
        <span class="floating-particle p-star-gold1">⭐</span>
        <span class="floating-particle p-star-glow1">🌟</span>
        <span class="floating-particle p-love-pink1">💖</span>
        <span class="floating-particle p-love-blue1">💙</span>
        <span class="floating-particle p-love-pulse1">💗</span>
        <span class="floating-particle p-star-shoot1">💫</span>
        <span class="floating-particle p-star-gold2">⭐</span>
        <span class="floating-particle p-love-dual1">💕</span>
        <span class="floating-particle p-love-white1">🤍</span>
        <span class="floating-particle p-star-glow2">🌟</span>
        <span class="floating-particle p-love-sparkle1">💖</span>
        <span class="floating-particle p-star-twinkle1">✨</span>
        <span class="floating-particle p-star-doodle1">⋆｡˚</span>
        <span class="floating-particle p-star-doodle2">˚｡⋆</span>
        <span class="floating-particle p-love-heartbeat">💓</span>
    </div>

    <!-- Big Blue Watercolor Star on Bottom Left (matching screenshot) -->
    <div class="watercolor-star-decor" aria-hidden="true">
        <svg viewBox="0 0 200 200" class="star-svg">
            <defs>
                <linearGradient id="starBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4a7cd6" stop-opacity="0.9" />
                    <stop offset="50%" stop-color="#3b6fc9" stop-opacity="0.85" />
                    <stop offset="100%" stop-color="#2a58ad" stop-opacity="0.95" />
                </linearGradient>
                <filter id="watercolorBlur" x="-20%" y="-20%" width="140%" height="140%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" />
                </filter>
            </defs>
            <polygon points="100,10 126,68 188,74 141,116 155,178 100,145 45,178 59,116 12,74 74,68"
                fill="url(#starBlueGrad)" filter="url(#watercolorBlur)" />
        </svg>
    </div>

    <!-- Floating Top Sound Toggle -->
    <div class="floating-sound-pill">
        <button id="soundToggleBtn" class="sound-quick-btn" title="Toggle Sound">🔊</button>
    </div>

    <!-- MAIN CONTAINER -->
    <main id="appContainer">

        <!-- ================= FLYING GIFTS POSTCARD (EXACT SCREENSHOT MATCH) ================= -->
        <section id="giftStage" class="stage-section active">
            <div class="flying-gifts-card-wrapper">
                <div class="flying-gifts-postcard messy-shape-box" id="flyingGiftsPostcard">
                    
                    <!-- Messy Organic Wobbly Contour Border SVG -->
                    <svg class="messy-shape-box-svg" viewBox="0 0 660 480" preserveAspectRatio="none" aria-hidden="true">
                        <!-- Messy Hand-Drawn Wobbly Inner Contour Line -->
                        <path class="messy-wobbly-line" fill="none" stroke="#861620" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M 56,38
                            Q 125,44 210,36
                            Q 320,30 420,38
                            Q 510,44 576,32
                            Q 615,30 632,44
                            Q 642,62 638,125
                            Q 634,202 646,280
                            Q 640,358 634,406
                            Q 640,448 608,458
                            Q 515,466 410,454
                            Q 320,448 230,460
                            Q 142,466 85,454
                            Q 48,460 34,430
                            Q 24,365 30,288
                            Q 22,210 28,132
                            Q 24,75 36,55
                            Q 38,40 56,38 Z" />
                    </svg>

                    <!-- Inner Postcard Content Views (100% Matching Sequence) -->
                    <div class="flying-gifts-inner-content">

                        <!-- SCENE 1: "I have made something for you" + Dancing Shinchan + "Do you wanna see it?" + YES / NO -->
                        <div class="postcard-view active" id="viewFrontPage">
                            <div class="arched-title-container">
                                <svg class="arch-title-svg" viewBox="0 0 600 85" aria-label="I have made something for you">
                                    <defs>
                                        <path id="archFrontPath" d="M 20,72 Q 300,10 580,72" fill="none" />
                                    </defs>
                                    <text class="arch-title-text">
                                        <textPath href="#archFrontPath" startOffset="50%" text-anchor="middle">
                                            I have made something for you
                                        </textPath>
                                    </text>
                                </svg>
                            </div>

                            <div class="shinchan-actor-stage">
                                <img src="assets/shinchan_dance.gif" alt="Dancing Shinchan" class="shinchan-actor-img" id="shinchanDanceImg">
                            </div>

                            <div class="wanna-see-prompt">Do you wanna see it?</div>

                            <div class="action-buttons-row">
                                <button id="chibiYesBtn" class="comic-pill-btn" type="button">
                                    <span class="comic-pill-text">YES</span>
                                </button>
                                <button id="chibiNoBtn" class="comic-pill-btn" type="button">
                                    <span class="comic-pill-text">NO</span>
                                </button>
                            </div>
                        </div>

                        <!-- SCENE 2: "HOW DARE YOU" + Crying Shinchan + TRY AGAIN -->
                        <div class="postcard-view is-hidden" id="viewCryPage">
                            <div class="arched-title-container arch-cry-container">
                                <svg class="arch-title-svg arch-cry-svg" viewBox="0 0 540 125" aria-label="HOW DARE YOU!?">
                                    <defs>
                                        <path id="archCryPath" d="M 50,110 Q 270,16 490,110" fill="none" />
                                    </defs>
                                    <text class="arch-title-text arch-cry-title-text">
                                        <textPath href="#archCryPath" startOffset="50%" text-anchor="middle">
                                            HOW DARE YOU!?
                                        </textPath>
                                    </text>
                                </svg>
                            </div>

                            <div class="shinchan-actor-stage cry-stage">
                                <div class="shinchan-cry-rotator">
                                    <div class="shinchan-cry-tantrum-actor">
                                        <img src="assets/shinchan_crying_upsidedown.png" alt="Crying Shinchan Tantrum" class="shinchan-actor-img cry-img" id="shinchanCryImg">
                                    </div>
                                </div>
                            </div>

                            <div class="action-buttons-row" style="margin-top: 14px;">
                                <button id="cryTryAgainBtn" class="comic-pill-btn try-again-bounce-btn" type="button">
                                    <span class="comic-pill-text">TRY AGAIN</span>
                                </button>
                            </div>
                        </div>

                        <!-- SCENE 3: "Are you really excited?" + Laughing Shinchan + YES / YES -->
                        <div class="postcard-view is-hidden" id="viewExcitedPage">
                            <div class="arched-title-container">
                                <svg class="arch-title-svg" viewBox="0 0 560 85" aria-label="Are you really excited?">
                                    <defs>
                                        <path id="archExcitedPath" d="M 20,72 Q 280,10 540,72" fill="none" />
                                    </defs>
                                    <text class="arch-title-text">
                                        <textPath href="#archExcitedPath" startOffset="50%" text-anchor="middle">
                                            Are you really excited?
                                        </textPath>
                                    </text>
                                </svg>
                            </div>

                            <div class="shinchan-actor-stage excited-stage">
                                <div class="excited-actor-wrap">
                                    <img src="assets/shinchan_normal.png" alt="Normal Shinchan" class="shinchan-actor-img face-normal" id="shinchanNormalImg">
                                    <img src="assets/shinchan_laughing.png" alt="Smiling Shinchan" class="shinchan-actor-img face-smiling" id="shinchanSmilingImg">
                                </div>
                            </div>

                            <div class="action-buttons-row">
                                <button id="excitedYesBtn1" class="comic-pill-btn" type="button">
                                    <span class="comic-pill-text">YES</span>
                                </button>
                                <button id="excitedYesBtn2" class="comic-pill-btn" type="button">
                                    <span class="comic-pill-text">YES</span>
                                </button>
                            </div>
                        </div>

                        <!-- SCENE 4: CAKE PAGE ("MAKE A WISH" + 2-Tier Birthday Cake + Candles + Shinchan with Balloons) -->
                        <div class="postcard-view is-hidden" id="viewCakePage">
                            <!-- Top Left Round White Back Button -->
                            <button class="gift-card-back-btn" id="cakeBackBtn" title="Back to gifts">
                                <svg viewBox="0 0 24 24" class="back-arrow-svg" aria-hidden="true">
                                    <path d="M 19 12 H 5 M 12 19 L 5 12 L 12 5" fill="none" stroke="#2c1810" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>

                            <!-- Arched Header: "MAKE A WISH" (Exact match to screenshot) -->
                            <div class="arched-title-container arch-cake-header">
                                <svg class="arch-title-svg arch-cake-svg" viewBox="0 0 620 95" aria-label="MAKE A WISH">
                                    <defs>
                                        <path id="archCakeWishPath" d="M 30,82 Q 310,12 590,82" fill="none" />
                                    </defs>
                                    <text class="arch-title-text arch-cake-title-text">
                                        <textPath href="#archCakeWishPath" startOffset="50%" text-anchor="middle">
                                            MAKE A WISH
                                        </textPath>
                                    </text>
                                </svg>
                            </div>

                            <!-- Doodles: "i love you", party hat, yellow stars, and streamers -->
                            <div class="cake-doodles-layer" aria-hidden="true">
                                <div class="cake-doodle-iloveyou">
                                    <span class="doodle-letter-i">i</span>
                                    <span class="doodle-line-1">l o v e</span>
                                    <span class="doodle-line-2">Y o u</span>
                                    <span class="doodle-sparkle">✨</span>
                                </div>
                                <div class="cake-doodle-partyhat">
                                    <span class="doodle-hat-icon">🥳</span>
                                </div>
                                <div class="cake-doodle-star star-tl">⭐</div>
                                <div class="cake-doodle-star star-tr">⭐</div>
                                <div class="cake-doodle-star star-bl">⭐</div>
                                <div class="cake-doodle-curl curl-tr">🎀</div>
                                <div class="cake-doodle-curl curl-tl">〰️</div>
                            </div>

                            <!-- Center Cake Stage: 2-Tier Cake rising from bottom to top -->
                            <div class="cake-display-stage" id="cakeDisplayStage">
                                <div class="cake-actor-container" id="cakeActor">
                                    <img src="assets/birthday_cake.png" alt="2-tier Birthday Cake" class="birthday-cake-img">
                                    
                                    <!-- 7 Interactive Candle Flames with Realistic Smoke Wisps (No Wind Symbols) -->
                                    <div class="cake-flames-overlay" id="cakeFlamesOverlay">
                                        <div class="candle-flame-wrapper flame-pos-1">
                                            <div class="candle-glow-aura"></div>
                                            <div class="candle-flame-shape"></div>
                                            <div class="candle-smoke-wisp">
                                                <span class="wisp-curl wisp-1"></span>
                                                <span class="wisp-curl wisp-2"></span>
                                            </div>
                                        </div>
                                        <div class="candle-flame-wrapper flame-pos-2">
                                            <div class="candle-glow-aura"></div>
                                            <div class="candle-flame-shape"></div>
                                            <div class="candle-smoke-wisp">
                                                <span class="wisp-curl wisp-1"></span>
                                                <span class="wisp-curl wisp-2"></span>
                                            </div>
                                        </div>
                                        <div class="candle-flame-wrapper flame-pos-3">
                                            <div class="candle-glow-aura"></div>
                                            <div class="candle-flame-shape"></div>
                                            <div class="candle-smoke-wisp">
                                                <span class="wisp-curl wisp-1"></span>
                                                <span class="wisp-curl wisp-2"></span>
                                            </div>
                                        </div>
                                        <div class="candle-flame-wrapper flame-pos-4">
                                            <div class="candle-glow-aura"></div>
                                            <div class="candle-flame-shape"></div>
                                            <div class="candle-smoke-wisp">
                                                <span class="wisp-curl wisp-1"></span>
                                                <span class="wisp-curl wisp-2"></span>
                                            </div>
                                        </div>
                                        <div class="candle-flame-wrapper flame-pos-5">
                                            <div class="candle-glow-aura"></div>
                                            <div class="candle-flame-shape"></div>
                                            <div class="candle-smoke-wisp">
                                                <span class="wisp-curl wisp-1"></span>
                                                <span class="wisp-curl wisp-2"></span>
                                            </div>
                                        </div>
                                        <div class="candle-flame-wrapper flame-pos-6">
                                            <div class="candle-glow-aura"></div>
                                            <div class="candle-flame-shape"></div>
                                            <div class="candle-smoke-wisp">
                                                <span class="wisp-curl wisp-1"></span>
                                                <span class="wisp-curl wisp-2"></span>
                                            </div>
                                        </div>
                                        <div class="candle-flame-wrapper flame-pos-7">
                                            <div class="candle-glow-aura"></div>
                                            <div class="candle-flame-shape"></div>
                                            <div class="candle-smoke-wisp">
                                                <span class="wisp-curl wisp-1"></span>
                                                <span class="wisp-curl wisp-2"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Shinchan with Heart Balloons in bottom right (Exact to Screenshot) -->
                            <div class="cake-shinchan-actor-wrap" id="cakeShinchanWrap">
                                <img src="assets/shinchan_balloons_sticker.png" alt="Shinchan holding heart balloons" class="cake-shinchan-img">
                            </div>

                            <!-- Interactive Party Popper Cannons in Bottom Corners -->
                            <div class="cake-corner-popper popper-left" id="cakeCornerPopperLeft" title="Party Popper!">
                                <span class="popper-emoji">🎉</span>
                            </div>
                            <div class="cake-corner-popper popper-right" id="cakeCornerPopperRight" title="Party Popper!">
                                <span class="popper-emoji">🎉</span>
                            </div>

                            <!-- Bottom Row Controls: BLOW CANDLES Button (No Wind Symbol) -->
                            <div class="cake-action-row">
                                <button id="blowCandlesBtn" class="comic-pill-btn blow-candles-btn" type="button">
                                    <span class="comic-pill-text">BLOW CANDLES 🎉</span>
                                </button>
                            </div>

                            <!-- Right Edge "CLICK ME" Pink Heart Button (Opens Gifts Page) -->
                            <button id="cakeClickMeBtn" class="postcard-clickme-heart-btn cake-side-clickme-btn" type="button" title="Click to see your gifts!">
                                <span class="heart-text">CLICK<br>ME</span>
                            </button>
                        </div>

                        <!-- SCENE 5: "Each gift has something for you.." + 3 Flying Gifts + CLICK ON THE GIFTS -->
                        <!-- SCENE 5: "Each gift has something for you.." + 3 Flying Gifts + CLICK ON THE GIFTS -->
                        <div class="postcard-view is-hidden" id="viewGiftsPage">
                            <!-- Hidden Back Button (Preserved for accessibility/logic, hidden to match screenshot) -->
                            <button class="gift-card-back-btn" id="flyingGiftsBackBtn" title="Back to previous question" aria-label="Back">
                                <svg viewBox="0 0 24 24" class="back-arrow-svg" aria-hidden="true">
                                    <path d="M 19 12 H 5 M 12 19 L 5 12 L 12 5" fill="none" stroke="#2c1810" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>

                            <!-- Right Red Chevron / Next Button (Matching Screenshot) -->
                            <button class="gift-card-next-btn" id="flyingGiftsNextBtn" title="See Birthday Wish" aria-label="Next">
                                <svg viewBox="0 0 24 24" class="next-chevron-svg" aria-hidden="true">
                                    <path d="M 8 4 L 16 12 L 8 20" fill="none" stroke="#8b0d18" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>

                            <!-- Arched Title: "Each gift has something for you.." (Exact match to screenshot) -->
                            <div class="arched-title-container arched-gifts-header">
                                <svg class="arch-title-svg arch-gifts-svg" viewBox="0 0 700 95" aria-label="Each gift has something for you..">
                                    <defs>
                                        <path id="archGiftsPath" d="M 25,82 Q 350,14 675,82" fill="none" />
                                    </defs>
                                    <text class="arch-title-text arch-gifts-title-text">
                                        <textPath href="#archGiftsPath" startOffset="50%" text-anchor="middle">
                                            Each gift has something for you..
                                        </textPath>
                                    </text>
                                </svg>
                            </div>

                            <!-- Flying Gifts Arena: 3 Flying Pink Gift Boxes with Flight Physics & Dynamic Shadows -->
                            <div class="flying-gifts-stage" id="flyingGiftsStage">
                                
                                <!-- Gift 1 (Left): Secret Love Letter -->
                                <div class="flying-gift-item gift-item-1 flying-in" data-gift="letter" id="giftItem1" role="button" tabindex="0" title="Click to open Gift 1!">
                                    <div class="flying-gift-actor actor-1">
                                        <img src="assets/pink_gift_box.png" alt="Flying Pink Gift Box 1" class="flying-gift-img">
                                        <div class="gift-opened-badge is-hidden">OPEN</div>
                                    </div>
                                    <div class="flying-gift-shadow shadow-1" aria-hidden="true"></div>
                                </div>

                                <!-- Gift 2 (Center): Our Memories Clothesline Board -->
                                <div class="flying-gift-item gift-item-2 flying-in" data-gift="coupons" id="giftItem2" role="button" tabindex="0" title="Click to open Gift 2!">
                                    <div class="flying-gift-actor actor-2">
                                        <img src="assets/pink_gift_box.png" alt="Flying Pink Gift Box 2" class="flying-gift-img">
                                        <div class="gift-opened-badge is-hidden">OPEN</div>
                                    </div>
                                    <div class="flying-gift-shadow shadow-2" aria-hidden="true"></div>
                                </div>

                                <!-- Gift 3 (Right): Romantic Love Letter & Winking Shinchan -->
                                <div class="flying-gift-item gift-item-3 flying-in" data-gift="promise" id="giftItem3" role="button" tabindex="0" title="Click to open Gift 3!">
                                    <div class="flying-gift-actor actor-3">
                                        <img src="assets/pink_gift_box.png" alt="Flying Pink Gift Box 3" class="flying-gift-img">
                                        <div class="gift-opened-badge is-hidden">OPEN</div>
                                    </div>
                                    <div class="flying-gift-shadow shadow-3" aria-hidden="true"></div>
                                </div>

                            </div>

                            <!-- Bottom Prompt: "CLICK ON THE GIFTS" (Exact match to screenshot) -->
                            <div class="click-one-prompt-wrap">
                                <h2 class="click-one-title" id="clickOneTitle">CLICK ON THE GIFTS</h2>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </section>
    </main>

    <!-- Modal for Gift Content -->
    <div id="giftModal" class="modal-backdrop">
        <div class="modal-dialog glass-panel">
            <button id="closeModalBtn" class="modal-close" title="Close">✕</button>
            <div id="modalContentSlot"></div>
        </div>
    </div>

    <!-- Full-Screen Magical Stardust & Firework Sparkles Canvas -->
    <canvas id="celebrationCanvas" class="celebration-canvas" aria-hidden="true"></canvas>

    <!-- Script -->
    <script src="script.js"></script>
</body>

</html>
