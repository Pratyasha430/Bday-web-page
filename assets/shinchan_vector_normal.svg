<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
    <g id="shinchan">
        <!-- Yellow Shorts -->
        <path d="M 54,180 L 155,180 L 155,208 L 105,208 L 100,200 L 95,208 L 54,208 Z" fill="#d4d84f" stroke="#1a1a1a" stroke-width="3.8" stroke-linejoin="round" />
        <line x1="100" y1="200" x2="100" y2="182" stroke="#1a1a1a" stroke-width="2.5" />

        <!-- Red Shirt (Body & Sleeves) -->
        <!-- Left arm sleeve behind cheek -->
        <path d="M 28,52 L 40,48 L 48,65 L 34,70 Z" fill="#e74c3c" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round" />
        <!-- Right arm behind back -->
        <path d="M 148,92 Q 170,118 162,145 Q 152,165 142,168 L 138,152 Q 148,138 142,118 Z" fill="#e74c3c" stroke="#1a1a1a" stroke-width="3.8" stroke-linejoin="round" />
        <!-- Main Red Torso -->
        <path d="M 54,130 L 138,110 L 155,180 L 54,180 Z" fill="#e74c3c" stroke="#1a1a1a" stroke-width="3.8" stroke-linejoin="round" />
        <!-- Collar line -->
        <path d="M 52,130 Q 80,135 110,126" fill="none" stroke="#1a1a1a" stroke-width="3.2" stroke-linecap="round" />

        <!-- Hair (Black Cap) -->
        <path d="M 50,38 Q 70,10 110,10 Q 150,12 155,50 Q 160,80 152,95 L 140,88 Q 144,55 135,38 Q 110,25 78,35 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2" />

        <!-- Head & Cheek (Peach Skin) -->
        <path d="M 50,38 Q 30,68 18,88 Q 10,108 26,122 Q 42,135 68,130 Q 120,125 145,95 Q 155,80 148,60 Q 138,40 115,30 Q 80,24 50,38 Z" fill="#f8b195" stroke="#1a1a1a" stroke-width="4.2" stroke-linejoin="round" />

        <!-- Right Ear -->
        <path d="M 146,55 Q 168,68 165,85 Q 160,98 145,96" fill="#f8b195" stroke="#1a1a1a" stroke-width="3.8" stroke-linejoin="round" />
        <path d="M 152,68 Q 158,76 154,84" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" />

        <!-- Hairline curve on forehead -->
        <path d="M 52,38 Q 80,25 120,33" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" />

        <!-- Thick Black Eyebrows -->
        <!-- Right eyebrow -->
        <path d="M 45,35 Q 60,18 78,30" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round" />
        <!-- Left eyebrow -->
        <path d="M 102,28 Q 120,15 138,26" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round" />

        <!-- Right eye (wide open, looking coyly) -->
        <path d="M 68,48 Q 78,44 88,48" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" />
        <ellipse cx="78" cy="66" rx="14" ry="17" fill="#1a1a1a" />
        <circle cx="75" cy="62" r="5.5" fill="#ffffff" />

        
        <!-- Left eye (open) -->
        <path d="M 118,52 Q 128,48 138,53" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" />
        <ellipse cx="128" cy="65" rx="12" ry="15" fill="#1a1a1a" />
        <circle cx="126" cy="62" r="5" fill="#ffffff" />
        
        
        <!-- Soft natural cheek glow -->
        <ellipse cx="60" cy="95" rx="14" ry="8" fill="#ff7675" opacity="0.18" />
        <ellipse cx="138" cy="85" rx="14" ry="8" fill="#ff7675" opacity="0.18" />
        
        
        <!-- Sweet closed smile -->
        <path d="M 58,122 Q 68,130 78,122" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round" />
        
    </g>
</svg>